[project]
name = "wax-on-wax-off"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "websockets>=13",
    "jsonschema>=4",
]

[project.optional-dependencies]
# Real arm only (robot laptop). Heavy; the hub runs in --mock mode without it.
arm = ["lerobot[rebot] @ git+https://github.com/huggingface/lerobot.git@main"]
vision = ["opencv-python", "mediapipe"]

[tool.setuptools.packages.find]
include = ["brain*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
