# Deploys the phone app: Convex backend (prod) + static site on GitHub Pages.
# Needs Settings -> Pages -> Source set to "GitHub Actions". Optional repo secret CONVEX_DEPLOY_KEY
# (Convex dashboard -> prod deployment -> Settings -> Deploy key) also deploys the backend on push.
name: Deploy phone app

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # With a deploy key: push convex/ to prod too, then build against it.
      # Without one: just build the site against the prod backend (deploy convex/ by hand
      # with `npx convex deploy`).
      - name: Build (and deploy Convex if CONVEX_DEPLOY_KEY is set)
        run: |
          if [ -n "$CONVEX_DEPLOY_KEY" ]; then
            npx convex deploy --cmd 'npm run build'
          else
            npm run build
          fi
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          VITE_CONVEX_URL: https://abundant-roadrunner-265.convex.cloud
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
